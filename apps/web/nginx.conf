server {
    listen 5173;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        default_type application/json;
        return 200 'MCP_PRM_JSON_PLACEHOLDER';
    }

    location = /.well-known/oauth-authorization-server/api {
        default_type application/json;
        return 200 'MCP_AS_JSON_PLACEHOLDER';
    }

    location /.well-known/ {
        return 404;
    }

    # Revalidate the HTML shell after deployments without dropping security headers.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    # Missing build chunks must not fall through to the SPA HTML.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        # Runtime environment replacement can change JS without changing its hash.
        expires -1;
    }

    # Root location
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

}
