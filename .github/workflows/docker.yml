name: Build & publish images to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images (e.g., 1.0.0)"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: ${{ github.repository != 'usekaneo/kaneo' && vars.RELAYOPS_PUBLISH_ENABLED == 'true' && vars.RELAYOPS_RELEASE_APPROVED == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    with:
      version: ${{ inputs.version }}
      tags: |
        type=raw,value=${{ inputs.version }}
        type=raw,value=latest,enable=${{ inputs.latest }}
