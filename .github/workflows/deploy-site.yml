name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "i18n/**"
      - "licenses/**"
      - "scripts/release/licenses.mjs"
      - "THIRD_PARTY_NOTICES"
      - "LICENSE"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository != 'usekaneo/kaneo' && vars.RELAYOPS_PUBLISH_ENABLED == 'true' && vars.RELAYOPS_RELEASE_APPROVED == 'true' }}
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @kaneo/site
        env:
          NEXT_PUBLIC_RELAYOPS_APP_URL: ${{ vars.RELAYOPS_APP_URL }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            export NEXT_PUBLIC_RELAYOPS_BASE_PATH=""
          else
            export NEXT_PUBLIC_RELAYOPS_BASE_PATH="/$repo_name"
          fi
          pnpm --filter @kaneo/site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/site/out

  deploy:
    if: ${{ github.repository != 'usekaneo/kaneo' && vars.RELAYOPS_PUBLISH_ENABLED == 'true' && vars.RELAYOPS_RELEASE_APPROVED == 'true' }}
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
