name: relayops
services:
  postgres:
    image: ${RELAYOPS_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm local:prepare first}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  relayops:
    image: relayops:local
    build:
      context: .
      dockerfile: Dockerfile.kaneo
    ports:
      - "127.0.0.1:${RELAYOPS_WEB_PORT:-32000}:5173"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PORT: "1337"
      HOST: "0.0.0.0"
      KANEO_CLIENT_URL: ${RELAYOPS_PUBLIC_URL:-http://127.0.0.1:32000}
      KANEO_API_URL: ${RELAYOPS_PUBLIC_URL:-http://127.0.0.1:32000}/api
      CORS_ORIGINS: ${RELAYOPS_PUBLIC_URL:-http://127.0.0.1:32000}
    volumes:
      - uploads:/app/apps/api/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
    external: true
    name: ${RELAYOPS_POSTGRES_VOLUME:?Run pnpm local:prepare first}
  uploads:
    name: relayops_uploads
