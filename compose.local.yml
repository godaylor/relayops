# Split web/API alternative; stop the bundled RelayOps website before using this file.
name: relayops
services:
  postgres:
    extends:
      file: compose.yml
      service: postgres
  api:
    image: relayops-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:${RELAYOPS_API_PORT:-32001}:1337"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PORT: "1337"
      HOST: "0.0.0.0"
      KANEO_API_URL: http://127.0.0.1:${RELAYOPS_API_PORT:-32001}
      KANEO_CLIENT_URL: ${RELAYOPS_PUBLIC_URL:-http://127.0.0.1:32000}
      CORS_ORIGINS: ${RELAYOPS_PUBLIC_URL:-http://127.0.0.1:32000}
    volumes:
      - uploads:/app/apps/api/data
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: relayops-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${RELAYOPS_WEB_PORT:-32000}:5173"
    environment:
      KANEO_API_URL: http://127.0.0.1:${RELAYOPS_API_PORT:-32001}
      KANEO_CLIENT_URL: ${RELAYOPS_PUBLIC_URL:-http://127.0.0.1:32000}
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
    external: true
    name: ${RELAYOPS_POSTGRES_VOLUME:?Run pnpm local:prepare}
  uploads:
    name: relayops_uploads
