# RelayOps on Coolify
#
# Deploy this stack from a Git source with Coolify's "Docker Compose" build pack:
#   Repository -> your own RelayOps repository (not selected yet)
#   Build Pack: Docker Compose | Base Directory: / | Compose Location: compose.coolify.yml
#
# Assign your chosen domain to the compatibility-named "kaneo" service using container port 5173.
# (visitors use the normal HTTPS URL; the port only tells Coolify where to route traffic).
#
# Required: your verified RELAYOPS_IMAGE, KANEO_CLIENT_URL and persistent encryption secrets below.
# AUTH_SECRET and the PostgreSQL password are auto-generated via Coolify magic variables.
# Do NOT set KANEO_API_URL — the entrypoint derives it from KANEO_CLIENT_URL (public URL + /api).
# RELAYOPS_IMAGE must identify your own immutable release; there is no upstream default.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kaneo:
    # Back up data and keyrings before the API applies startup migrations.
    image: ${RELAYOPS_IMAGE:?Set your own verified RelayOps image and immutable tag}
    environment:
      - KANEO_CLIENT_URL=${KANEO_CLIENT_URL:?}
      - AUTH_SECRET=${SERVICE_HEX_64_KANEO:?}
      - NOTIFICATION_SECRET_ENCRYPTION_KEY=${NOTIFICATION_SECRET_ENCRYPTION_KEY:?}
      - RELAYOPS_WEBHOOK_ENCRYPTION_KEY=${RELAYOPS_WEBHOOK_ENCRYPTION_KEY:?}
      # The image derives DATABASE_URL from these POSTGRES_* variables at startup.
      # POSTGRES_PASSWORD is the same generated value shared with the postgres service.
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      # Optional: SMTP_*, SSO providers, GitHub integration, Sentry, Redis...
      # add them here or in the Coolify UI for the kaneo service.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
